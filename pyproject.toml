[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalem-wind-agent"
version = "0.1.0"
description = "Auditable autonomous wind power forecasts using dated weather model runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
wind-agent = "windagent.__main__:main"

[tool.setuptools.packages.find]
include = ["windagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

